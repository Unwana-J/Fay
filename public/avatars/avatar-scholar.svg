  <path d="M64 45 L68 43" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="42" cy="45" r="2" fill="#2B1E16"/>
  <circle cx="58" cy="45" r="2" fill="#2B1E16"/>
  <!-- Eyebrows -->
  <path d="M37 38 C39 36 44 36 46 38" stroke="#3D2B1F" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M54 38 C56 36 61 36 63 38" stroke="#3D2B1F" stroke-width="1.5" stroke-linecap="round" fill="none"/>
